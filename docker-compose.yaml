version: "3.9"
services:
  nginx:
    build: .
    init: true
    ports:
      - "8080:8080"
    volumes:
      - ./resources/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./resources/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./resources/web:/usr/share/nginx/html:rw
      - ./resources/cgi-bin:/var/www/cgi-bin:ro
      - ./resources/put_test:/var/www/uploads:rw
    tmpfs:
      - /dev/shm
      - /var/cache/nginx:rw,size=256m,mode=1777
