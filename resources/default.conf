server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;
	autoindex off;

	location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
		add_header Andrei "Won the battle" always;
		if ( $request_method !~ ^(GET)$ ) {
			return 405;
		}
    }

	location = /directory { return 301 /directory/; }

#	location /directory/ {
#		alias /usr/share/nginx/html/YoupiBanane/;
#		if ($request_method != GET) { return 405; }
#		index youpi.bad_extension;
#		autoindex off;
#		try_files $uri $uri/ /directory/youpi.bad_extension =404;
#	}

	location /directory/ {
		alias /usr/share/nginx/html/YoupiBanane/;

		if ($request_method != GET) { return 405; }

		index off; # do not let nginx "discover" directories
		try_files
			$uri
			$uri/youpi.bad_extension
			/directory/youpi.bad_extension
			=404;
	}

	location ~ \.bla$ {
		# if ($request_method != POST) { return 405; }

		client_max_body_size 104857601;
		client_body_buffer_size 16m;
        client_body_temp_path /dev/shm/client_temp 1 2;
		client_body_timeout 300s;

		# fastcgi_request_buffering off;
		# fastcgi_buffering off;
		# fastcgi_cache off;
		# fastcgi_max_temp_file_size 0; # 1024m;

		fastcgi_connect_timeout 30s;
		fastcgi_send_timeout    600s;
		fastcgi_read_timeout    600s;

		include fastcgi_params;
		fastcgi_param GATEWAY_INTERFACE CGI/1.1;
		fastcgi_param SERVER_PROTOCOL   $server_protocol;

		fastcgi_param SCRIPT_FILENAME   /var/www/cgi-bin/echo_after_read.sh;
		fastcgi_param SCRIPT_NAME       /cgi-bin/echo_after_read.sh;
#		fastcgi_param SCRIPT_FILENAME   /var/www/cgi-bin/fast_discard.sh;
#		fastcgi_param SCRIPT_NAME       /cgi-bin/fast_discard.sh;
#		fastcgi_param SCRIPT_FILENAME   /var/www/cgi-bin/ubuntu_cgi_tester;
#		fastcgi_param SCRIPT_NAME       /cgi-bin/ubuntu_cgi_tester;

		fastcgi_param PATH_INFO         $uri;
		fastcgi_param PATH_TRANSLATED   $document_root$uri;

		fastcgi_param = REQUEST_METHOD 	$request_method;
		fastcgi_param = CONTENT_LENGTH  $content_length;
		fastcgi_param = CONTENT_TYPE    $content_type;
		fastcgi_param = QUERY_STRING    $query_string;

		fastcgi_pass unix:/run/fcgiwrap.sock;
	}

	location /put_test/ {
		alias /var/www/uploads/$1;
		dav_methods PUT DELETE;
		create_full_put_path on;
        dav_access group:rw  all:r;
		client_max_body_size 100m;
		# if ($request_method != PUT) { return 405; }
	}

	location = /post_body {
		if ($request_method != POST) { return 405; }

		client_max_body_size 100;
		client_body_timeout  60s;

		fastcgi_request_buffering on;
		fastcgi_buffering off;
		fastcgi_cache off;
		fastcgi_connect_timeout 10s;
		fastcgi_send_timeout    60s;
		fastcgi_read_timeout    60s;

		include fastcgi_params;
		fastcgi_param GATEWAY_INTERFACE CGI/1.1;
		fastcgi_param SERVER_PROTOCOL   $server_protocol;

		fastcgi_param SCRIPT_FILENAME   /var/www/cgi-bin/post_body_ok.sh;
		fastcgi_param SCRIPT_NAME       /cgi-bin/post_body_ok.sh;

		fastcgi_param REQUEST_METHOD    $request_method;
		fastcgi_param CONTENT_LENGTH    $content_length;
		fastcgi_param CONTENT_TYPE      $content_type;

		fastcgi_pass unix:/run/fcgiwrap.sock;
	}

	# location = /post_body {
	# 	if ($request_method != POST) { return 405; }
	# 	client_max_body_size 100;
	# 	# if ($content_length -gt 100) { return 413; }
	# 	return 200 "ok\n";
	# }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

