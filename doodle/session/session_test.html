<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webserv Session Test</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    code, pre { background: #f3f3f3; padding: 0.2rem 0.4rem; border-radius: 4px; }
    button { margin-right: 0.5rem; margin-top: 0.5rem; }
    #out { white-space: pre-wrap; padding: 1rem; background: #f7f7f7; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Session/Cookie Probe</h1>
  <p>This page helps validate cookie-based session flow once the session manager is wired.</p>

  <div>
    <button id="set-cookie">Set Cookie</button>
    <button id="show-cookie">Show Cookies</button>
    <button id="call-cgi">Call Session CGI</button>
  </div>

  <h3>Output</h3>
  <pre id="out">Ready.</pre>

  <script>
    const out = document.getElementById("out");
    const append = (msg) => { out.textContent += `\n${msg}`; };

    document.getElementById("set-cookie").onclick = () => {
      document.cookie = "ws_session_demo=client-seed; Path=/; Max-Age=3600; SameSite=Lax";
      append("Set ws_session_demo cookie from browser JS.");
    };

    document.getElementById("show-cookie").onclick = () => {
      append(`document.cookie => ${document.cookie || "(empty)"}`);
    };

    document.getElementById("call-cgi").onclick = async () => {
      try {
        const resp = await fetch("/session_echo.py", { credentials: "include" });
        const text = await resp.text();
        append(`CGI status: ${resp.status}`);
        append(text);
      } catch (err) {
        append(`CGI call failed: ${err}`);
      }
    };
  </script>
</body>
</html>
